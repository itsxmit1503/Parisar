name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias parisar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass parisar2026 \
            -keypass parisar2026 \
            -dname "CN=PARISAR, OU=DHSGSU, O=Dr. Harisingh Gour Vishwavidyalaya, L=Sagar, ST=Madhya Pradesh, C=IN"

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./parisar-v1.0.0-release.apk
          ls -lh parisar-v1.0.0-release.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parisar-v1.0.0-release-apk
          path: parisar-v1.0.0-release.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading genuine signed APK to GitHub Release v1.0.0..."
          gh release upload v1.0.0 parisar-v1.0.0-release.apk --clobber || \
          gh release create v1.0.0 parisar-v1.0.0-release.apk \
            --title "PARISAR Android App v1.0.0 (Official Release)" \
            --notes "Official compiled and signed Android companion release for Dr. Harisingh Gour Vishwavidyalaya (DHSGSU), Sagar (M.P.)."
