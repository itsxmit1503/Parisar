name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile & Publish Latest Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias parisar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass parisar2026 \
            -keypass parisar2026 \
            -dname "CN=PARISAR, OU=DHSGSU, O=Dr. Harisingh Gour Vishwavidyalaya, L=Sagar, ST=Madhya Pradesh, C=IN"

      - name: Build Android Release APK
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./parisar-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk ./parisar-v2.0.0-release.apk
          ls -lh parisar-release.apk parisar-v2.0.0-release.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parisar-v2.0.0-release-apk
          path: parisar-v2.0.0-release.apk
          if-no-files-found: error

      - name: Replace All Previous Releases with Fresh Timestamped v2.0.0 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting all previous releases and tags so the new release has the current timestamp..."
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done

          echo "Publishing fresh v2.0.0 release..."
          gh release create v2.0.0 parisar-v2.0.0-release.apk parisar-release.apk \
            --title "PARISAR Android App v2.2.0 (Official Release — DHSGSU)" \
            --notes "Official compiled and signed Android release for Dr. Harisingh Gour Vishwavidyalaya (DHSGSU), Sagar (M.P.). Includes Real Google Maps DHSGSU Campus Map with verified Patharia Hills GIS coordinates & native Google Maps directions, unified cross-platform Web + Android authentication (/api/v1/auth), Student / Verified Organizer / University Administrator panels, Digital QR Event Passes, and Attendance Scanner." \
            --latest
