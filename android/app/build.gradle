plugins {
    id 'com.android.application'
}

android {
    namespace 'in.edu.dhsgsu.parisar'
    compileSdk 34

    defaultConfig {
        applicationId "in.edu.dhsgsu.parisar"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2.0"

        // Load Google Maps API Key from environment or gradle properties (no hardcoded secret keys)
        def mapsApiKey = project.findProperty("MAPS_API_KEY") ?: System.getenv("MAPS_API_KEY") ?: System.getenv("NEXT_PUBLIC_GOOGLE_MAPS_API_KEY") ?: ""
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file('release.keystore').exists()) {
                storeFile file('release.keystore')
                storePassword 'parisar2026'
                keyAlias 'parisar'
                keyPassword 'parisar2026'
            }
        }
    }

    buildTypes {
        release {
            if (file('release.keystore').exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
}
